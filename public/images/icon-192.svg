<!-- 🔑 LEARNING: Inline SVG placeholder for PWA icon (192x192).
     In production, this would be a proper pixel art icon.
     For v0, we use a simple SVG that looks pixelated.
     The viewBox is 192x192 to match the icon size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" fill="#1a0a00"/>
  <!-- Simple timer icon -->
  <circle cx="96" cy="100" r="60" fill="none" stroke="#facc15" stroke-width="8"/>
  <rect x="88" y="40" width="16" height="16" fill="#facc15"/>
  <line x1="96" y1="100" x2="96" y2="60" stroke="#e84530" stroke-width="8" stroke-linecap="butt"/>
  <line x1="96" y1="100" x2="130" y2="100" stroke="#facc15" stroke-width="6" stroke-linecap="butt"/>
  <!-- "DR" text -->
  <text x="96" y="150" font-family="monospace" font-size="28" fill="#facc15" text-anchor="middle" font-weight="bold">DR</text>
</svg>
